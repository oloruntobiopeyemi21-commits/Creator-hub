<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator Hub</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

    :root {
      --bg: #0E1614;
      --bg-raised: #16211E;
      --ink: #EAF2EE;
      --ink-dim: #8FA69C;
      --line: rgba(234,242,238,0.12);
      --lime: #C6FF3D;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--bg-raised);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--ink-dim);
      font-size: 14px;
      margin-bottom: 24px;
    }

    textarea {
      width: 100%;
      height: 120px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      color: var(--ink);
      font-family: inherit;
      font-size: 15px;
      resize: vertical;
      outline: none;
      margin-bottom: 16px;
    }

    textarea:focus {
      border-color: var(--lime);
    }

    button {
      width: 100%;
      background: var(--lime);
      color: #000;
      border: none;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .output-box {
      margin-top: 24px;
      padding: 20px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      min-height: 80px;
      color: var(--ink-dim);
      font-size: 15px;
      white-space: pre-wrap;
      display: none;
    }

    .output-box.active {
      display: block;
      color: var(--ink);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Creator Hub</h1>
    <p class="subtitle">Generate content using OpenRouter & Claude Sonnet 3.5</p>

    <textarea id="promptInput" placeholder="Enter your prompt here..."></textarea>
    <button id="generateBtn" onclick="generateContent()">Generate Content</button>

    <div id="resultBox" class="output-box"></div>
  </div>

  <script>
    async function generateContent() {
      const input = document.getElementById('promptInput');
      const btn = document.getElementById('generateBtn');
      const resultBox = document.getElementById('resultBox');

      const promptText = input.value.trim();
      if (!promptText) return;

      btn.disabled = true;
      btn.innerText = "Generating...";
      resultBox.style.display = "block";
      resultBox.innerText = "Thinking...";

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: promptText })
        });

        const data = await response.json();

        if (data.choices && data.choices[0]) {
          resultBox.innerText = data.choices[0].message.content;
        } else {
          resultBox.innerText = "Error: " + JSON.stringify(data);
        }
      } catch (err) {
        resultBox.innerText = "Network Error: Could not generate response.";
      } finally {
        btn.disabled = false;
        btn.innerText = "Generate Content";
      }
    }
  </script>

</body>
</html>
